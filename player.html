<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="v5.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="origin">
  <title>ermnium player.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    /* ── ERMN THEME VARIABLES ── */
    :root {
      --accent: #3b5998;
      --accent2: #8b9dc3;
      --bg: #dfe7f3;
      --bg2: #f0f2f5;
      --surface: #fff;
      --surface2: #f5f6f7;
      --topbar-bg: #3b5998;
      --text: #333;
      --text-muted: #667;
      --border: #b0b7c3;
      --card-w: 156px;
      --nav-h: 44px;
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    /* ERMN THEMES */
    .theme-bubblegum { --accent: #e91e8c; --accent2: #f9a8d4; --bg: #ffe4f3; --bg2: #fff0fb; --topbar-bg: #e91e8c; --text: #5a0030; --border: #f9a8d4; }
    .theme-midnight { --accent: #7b68ee; --accent2: #a78bfa; --bg: #0a0a1a; --bg2: #12122a; --surface: #1a1a2e; --surface2: #111e2e; --topbar-bg: #0d0d1f; --text: #c8d0e8; --border: #2a2a4a; --text-muted: #8090b0; }
    .theme-y2k { --accent: #0055cc; --accent2: #99bbff; --bg: #c0e8ff; --bg2: #e8f4ff; --topbar-bg: #0055cc; --text: #002266; --border: #99bbff; }
    .theme-limeade { --accent: #2d7a2d; --accent2: #a3d9a3; --bg: #e8fce8; --bg2: #f5fff5; --surface: #f9fff9; --topbar-bg: #2d7a2d; --text: #1a3d1a; --border: #a3d9a3; }

    /* ── RESET ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Tahoma, Verdana, sans-serif; background: #000; color: var(--text); min-height: 100vh; font-size: 13px; margin: 0; display: flex; flex-direction: column; }

    /* ── PLAYER VIEW ── */
    #playerView {
      display: flex;
      flex-direction: column;
      flex: 1;
      height: 100vh;
    }

    .player-topbar {
      background: var(--topbar-bg);
      height: 44px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 10px;
      border-bottom: 2px solid rgba(0, 0, 0, 0.2);
      flex-shrink: 0;
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 3px 10px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
      font-family: inherit;
    }
    .back-btn:hover { background: rgba(255, 255, 255, 0.35); }

    .player-playing { font-size: 14px; font-weight: bold; color: white; font-style: italic; }
    .player-subtitle { font-size: 11px; color: rgba(255, 255, 255, 0.7); margin-top: 1px; }

    .player-type-badge {
      font-size: 10px;
      padding: 2px 6px;
      font-weight: bold;
      margin-left: auto;
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
      background: rgba(0, 0, 0, 0.3);
    }

    .player-actions { display: flex; gap: 6px; align-items: center; }
    .source-switcher { display: flex; gap: 3px; }
    
    .source-btn {
      background: rgba(255, 255, 255, 0.15);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 2px 8px;
      font-size: 11px;
      cursor: pointer;
      font-family: inherit;
    }
    .source-btn.active { background: var(--accent); border-color: var(--accent); }
    .source-btn.network-active { background: #0055cc; border-color: #0055cc; }

    .player-fav-btn {
      background: none;
      color: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 2px 8px;
      font-size: 16px;
      cursor: pointer;
    }
    .player-fav-btn.active { color: gold; border-color: gold; }

    .player-iframe { flex: 1; width: 100%; border: none; background: #000; }

    .player-body {
      background: var(--surface);
      border-top: 2px solid var(--border);
      display: grid;
      grid-template-columns: 1fr 240px;
      gap: 0;
      max-height: 260px;
      overflow-y: auto;
    }

    .p-info { padding: 14px; }
    .p-info h2 { font-size: 15px; color: var(--accent); margin-bottom: 6px; font-style: italic; }
    .p-chips { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
    .p-chip { font-size: 10px; padding: 2px 7px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); }
    .p-chip.gold { color: #b8860b; border-color: gold; }
    .p-chip.blue { color: var(--accent); border-color: var(--accent2); }
    .p-chip.hi { background: var(--accent); color: white; border-color: var(--accent); }
    .p-plot { font-size: 12px; color: var(--text-muted); line-height: 1.6; margin-bottom: 8px; }
    .p-crew p { font-size: 11px; color: var(--text-muted); margin-bottom: 3px; }
    .p-crew strong { color: var(--text); }

    .ep-picker { padding: 14px; border-left: 1px solid var(--border); }
    .ep-picker-title { font-size: 12px; font-weight: bold; color: var(--accent); margin-bottom: 8px; }
    .ep-picker-controls { margin-bottom: 8px; }
    .ep-select { padding: 4px 6px; border: 1px solid var(--border); font-family: inherit; font-size: 12px; background: var(--surface); color: var(--text); width: 100%; }
    .ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 3px; }
    .ep-btn { padding: 4px 2px; font-size: 11px; font-weight: bold; text-align: center; background: var(--surface2); border: 1px solid var(--border); cursor: pointer; font-family: inherit; color: var(--text); }
    .ep-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
    .ep-btn:hover:not(.active) { background: var(--border); }

    @media(max-width: 768px) {
      .player-body { grid-template-columns: 1fr; display: flex; flex-direction: column; }
      .ep-picker { border-left: none; border-top: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <div id="playerView">
    <div class="player-topbar">
      <button class="back-btn" onclick="goBack()">←</button>
      <div>
        <div class="player-playing" id="playerTitle">Loading...</div>
        <div class="player-subtitle" id="playerSubtitle"></div>
      </div>
      <span class="player-type-badge" id="playerTypeBadge"></span>
      <div class="player-actions">
        <div class="source-switcher" id="sourceSwitcher">
          <button class="source-btn active" id="srcVidsrcBtn" onclick="switchSource('vidsrc')">Vidsrc</button>
          <button class="source-btn" id="srcSuperBtn" onclick="switchSource('super')">SuperEmbed</button>
          <button class="source-btn" id="srcMultiBtn" onclick="switchSource('multi')">MultiEmbed</button>
        </div>
        <button class="player-fav-btn" id="playerFavBtn" onclick="togglePlayerFav()">☆</button>
      </div>
    </div>
    <iframe class="player-iframe" id="playerIframe" allowfullscreen referrerpolicy="origin"></iframe>
    <div class="player-body">
      <div class="p-info">
        <h2 id="pTitle"></h2>
        <div class="p-chips" id="pChips"></div>
        <p class="p-plot" id="pPlot"></p>
        <div class="p-crew" id="pCrew"></div>
      </div>
      <div id="epPicker" class="ep-picker" style="display:none">
        <div class="ep-picker-title">📺 Episodes</div>
        <div class="ep-picker-controls">
          <select class="ep-select" id="seasonSelect" onchange="loadEpisodes()"></select>
        </div>
        <div class="ep-grid" id="epGrid"></div>
      </div>
    </div>
  </div>

  <script>
    const TMDB_KEY = 'f26f2c1af6865eeaadb1d83692f89f8c';
    const TMDB_BASE = 'https://api.themoviedb.org/3';
    
    let currentItem = null;
    let currentSeason = 1;
    let currentEpisode = 1;
    let currentSource = 'vidsrc';
    let CU = null;
    let CP = null;

    function ls(k, v) { if (v === undefined) { try { const x = localStorage.getItem(k); return x ? JSON.parse(x) : null } catch { return null } } try { localStorage.setItem(k, JSON.stringify(v)) } catch { } }

    async function tmdb(path, params = {}) {
      let url = `${TMDB_BASE}${path}?api_key=${TMDB_KEY}&language=en-US`;
      Object.entries(params).forEach(([k, v]) => url += `&${k}=${encodeURIComponent(v)}`);
      try {
        const r = await fetch(url);
        if (!r.ok) return null;
        return await r.json();
      } catch (e) {
        return null;
      }
    }

    function getUrlParams() {
      const params = new URLSearchParams(window.location.search);
      return {
        id: params.get('id'),
        type: params.get('type') || 'movie'
      };
    }

    function goBack() {
      if (document.referrer.includes(window.location.hostname)) {
        window.history.back();
      } else {
        window.location.href = 'index.html';
      }
    }

    async function initPlayer() {
      // Set Theme
      const u = ls('erm_user');
      if (u) {
        CU = u;
        const p = ls(`erm_prof_${CU.id}`);
        if (p) {
          CP = p;
          if (CP.theme && CP.theme !== 'classic') {
            document.body.classList.add(`theme-${CP.theme}`);
          }
        }
      }

      const params = getUrlParams();
      if (!params.id) {
        document.getElementById('playerTitle').textContent = 'Error: No ID provided';
        return;
      }

      const data = await tmdb(`/${params.type}/${params.id}`);
      if (!data) {
        document.getElementById('playerTitle').textContent = 'Error: Failed to load info';
        return;
      }

      currentItem = data;
      currentItem._type = params.type;

      // Update UI
      const title = data.title || data.name;
      document.getElementById('playerTitle').textContent = title;
      document.getElementById('pTitle').textContent = title;
      document.getElementById('playerTypeBadge').textContent = params.type === 'tv' ? 'TV SHOW' : 'MOVIE';
      document.getElementById('pPlot').textContent = data.overview || 'No plot available.';

      const chips = document.getElementById('pChips');
      chips.innerHTML = '';
      if (data.vote_average) {
        const c = document.createElement('span'); c.className = 'p-chip gold';
        c.textContent = `★ ${data.vote_average.toFixed(1)}`; chips.appendChild(c);
      }
      if (data.release_date || data.first_air_date) {
        const y = (data.release_date || data.first_air_date).substring(0,4);
        const c = document.createElement('span'); c.className = 'p-chip';
        c.textContent = y; chips.appendChild(c);
      }
      if (data.genres) {
        data.genres.slice(0,3).forEach(g => {
          const c = document.createElement('span'); c.className = 'p-chip blue';
          c.textContent = g.name; chips.appendChild(c);
        });
      }

      const credits = await tmdb(`/${params.type}/${params.id}/credits`);
      if (credits) {
        let crewHtml = '';
        if (params.type === 'movie') {
          const dir = credits.crew.find(c => c.job === 'Director');
          if (dir) crewHtml += `<p><strong>Director:</strong> ${dir.name}</p>`;
        } else if (data.created_by && data.created_by.length) {
          crewHtml += `<p><strong>Creator:</strong> ${data.created_by.map(c=>c.name).join(', ')}</p>`;
        }
        if (credits.cast && credits.cast.length) {
          crewHtml += `<p><strong>Cast:</strong> ${credits.cast.slice(0,4).map(c=>c.name).join(', ')}</p>`;
        }
        document.getElementById('pCrew').innerHTML = crewHtml;
      }

      if (params.type === 'tv') {
        document.getElementById('epPicker').style.display = 'block';
        const sel = document.getElementById('seasonSelect');
        sel.innerHTML = '';
        data.seasons.forEach(s => {
          if (s.season_number > 0) {
            const opt = document.createElement('option');
            opt.value = s.season_number;
            opt.textContent = s.name || `Season ${s.season_number}`;
            sel.appendChild(opt);
          }
        });
        if (data.seasons.length > 0) {
          currentSeason = sel.options[0].value;
          loadEpisodes();
        }
      } else {
        document.getElementById('playerSubtitle').textContent = (data.release_date||'').substring(0,4);
        reloadIframe();
      }

      updateFavBtn();
    }

    async function loadEpisodes() {
      currentSeason = document.getElementById('seasonSelect').value;
      const data = await tmdb(`/tv/${currentItem.id}/season/${currentSeason}`);
      const grid = document.getElementById('epGrid');
      grid.innerHTML = '';
      
      if (data && data.episodes) {
        data.episodes.forEach(ep => {
          const btn = document.createElement('button');
          btn.className = 'ep-btn';
          btn.textContent = ep.episode_number;
          btn.title = ep.name;
          if (ep.episode_number == currentEpisode) btn.classList.add('active');
          btn.onclick = () => {
            currentEpisode = ep.episode_number;
            grid.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            reloadIframe();
          };
          grid.appendChild(btn);
        });
        
        // Select first episode if changing seasons
        if (!data.episodes.find(e => e.episode_number == currentEpisode)) {
            currentEpisode = data.episodes[0].episode_number;
        }
      }
      reloadIframe();
    }

    function switchSource(src) {
      currentSource = src;
      document.querySelectorAll('.source-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`src${src.charAt(0).toUpperCase() + src.slice(1)}Btn`).classList.add('active');
      reloadIframe();
    }

    function reloadIframe() {
      if (!currentItem) return;
      const iframe = document.getElementById('playerIframe');
      const isTV = currentItem._type === 'tv';
      const id = currentItem.id;
      
      if (isTV) {
        document.getElementById('playerSubtitle').textContent = `S${currentSeason} E${currentEpisode}`;
      }

      let srcUrl = '';
      if (currentSource === 'vidsrc') {
        srcUrl = isTV ? `https://vidsrc.net/embed/tv?tmdb=${id}&season=${currentSeason}&episode=${currentEpisode}` : `https://vidsrc.net/embed/movie?tmdb=${id}`;
      } else if (currentSource === 'super') {
        srcUrl = isTV ? `https://multiembed.mov/directstream.php?video_id=${id}&tmdb=1&s=${currentSeason}&e=${currentEpisode}` : `https://multiembed.mov/directstream.php?video_id=${id}&tmdb=1`;
      } else if (currentSource === 'multi') {
        srcUrl = isTV ? `https://multiembed.mov/?video_id=${id}&tmdb=1&s=${currentSeason}&e=${currentEpisode}` : `https://multiembed.mov/?video_id=${id}&tmdb=1`;
      }

      iframe.src = srcUrl;
      
      // Save history
      if (CU && CP) {
        const key = `erm_hist_${CU.id}_${CP.id}`;
        let hist = ls(key) || [];
        hist = hist.filter(m => !(m.id === currentItem.id && m._type === currentItem._type));
        const title = currentItem.title || currentItem.name || '';
        hist.unshift({ id: currentItem.id, title, name: currentItem.name, poster_path: currentItem.poster_path, release_date: currentItem.release_date || currentItem.first_air_date, vote_average: currentItem.vote_average, _type: currentItem._type });
        if (hist.length > 60) hist = hist.slice(0, 60);
        ls(key, hist);
      }
    }

    function updateFavBtn() {
      if (!currentItem || !CU || !CP) return;
      const key = `erm_favs_${CU.id}_${CP.id}`;
      const favs = ls(key) || [];
      const isFav = favs.some(f => f.id === currentItem.id && f._type === currentItem._type);
      const btn = document.getElementById('playerFavBtn');
      btn.textContent = isFav ? '★' : '☆';
      btn.classList.toggle('active', isFav);
    }

    function togglePlayerFav() {
      if (!currentItem || !CU || !CP) return;
      const key = `erm_favs_${CU.id}_${CP.id}`;
      let favs = ls(key) || [];
      const idx = favs.findIndex(f => f.id === currentItem.id && f._type === currentItem._type);
      const title = currentItem.title || currentItem.name || '';
      
      if (idx === -1) {
        favs.push({ id: currentItem.id, title, name: currentItem.name, poster_path: currentItem.poster_path, release_date: currentItem.release_date || currentItem.first_air_date, vote_average: currentItem.vote_average, _type: currentItem._type });
      } else {
        favs.splice(idx, 1);
      }
      ls(key, favs);
      updateFavBtn();
    }

    window.onload = initPlayer;
  </script>
</body>
</html>
